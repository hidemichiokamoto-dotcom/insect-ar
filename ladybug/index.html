<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>テントウムシ AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      text-align: center;
      font-family: sans-serif;
      background-color: #ffffff;
    }

    h1 {
      margin-top: 20px;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background-color: #f5f5f5;
    }

    .ar-button {
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 15px 25px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>テントウムシ</h1>

  <model-viewer
  src="Ladybug.glb"
  alt="テントウムシの3Dモデル"
  ar
  ar-modes="scene-viewer quick-look webxr"
  camera-controls
  autoplay
  shadow-intensity="1">

    <button slot="ar-button" class="ar-button">
      ARでみる
    </button>

  </model-viewer>

</body>
</html>
