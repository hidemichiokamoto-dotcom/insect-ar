<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ノコギリクワガタ AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; text-align: center; font-family: sans-serif; background: #fff; }
    h1 { margin-top: 20px; }
    model-viewer { width: 100%; height: 70vh; background: #f5f5f5; }
    .ar-button, .ios-ar-button {
      display: inline-block; background: #2e7d32; color: white; border: none;
      border-radius: 10px; padding: 15px 25px; font-size: 18px;
      text-decoration: none; cursor: pointer; margin: 18px 0 28px;
    }
    .ios-ar-wrap { display: none; }
    .ios-ar-button img { width: 22px; height: 22px; vertical-align: middle; margin-right: 8px; }
    body.ios .ar-button { display: none; }
    body.ios .ios-ar-wrap { display: block; }
  </style>
</head>
<body>
  <h1>ノコギリクワガタ</h1>
  <model-viewer
    src="Sawtooth_Stag_NoCube.glb"
    alt="ノコギリクワガタの3Dモデル"
    ar
    ar-modes="scene-viewer webxr"
    camera-controls
    autoplay
    shadow-intensity="1">
    <button slot="ar-button" class="ar-button">ARでみる</button>
  </model-viewer>

  <div class="ios-ar-wrap">
    <a class="ios-ar-button" rel="ar" href="Sawtooth_Stag_BeetleOnly_v2.usdz">
      <img src="ar-icon.svg" alt="">
      iPhoneでARを見る
    </a>
  </div>

  <script>
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isiOS = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isiOS) document.body.classList.add('ios');
  </script>
</body>
</html>
